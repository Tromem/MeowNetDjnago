
{%extends 'main.html'%}
{%load static%}
!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {%block title%} Ваш профиль {%endblock%}
    {%block link%} 
    <link rel="stylesheet" href="{%static 'css/profile.css'%}">
    {%endblock%}
</head>
<body>
    {%block content%}
        {%block messages%}
        <div class="message-inf" id="message-inf">
          
           
        </div>
    {%endblock%}

     <div class="main-container">
          <div class="user-bar">
             <div class="button-blocks">
                <a href="{%url 'profile'%}"><div class="Main-inf "><button>Лицевой счет</button></div></a>
           </div> 
            <div class="button-blocks">
                <a href="{%url 'services'%}"><div class="services"><button>Услуги</button></div></a>
            </div> 
           <div class="button-blocks">
                <a href="{%url 'settingsuser'%}"> <div class="changing-profile selected-button"><button>Изменение профиля</button></div></a>
           </div>
        </div>
            <div class="container-other">

    <div class="user-profile-inf">

        <div class="form-group">
            <label>ФИО:</label>
            <input type="text" class="input-user" value="{{ user.user_last_name }}">
        </div>

        <div class="form-group">
            <label>Номер телефона:</label>
            <input type="text" class="input-user" value="{{ user.numberphone }}">
        </div>

        <div class="form-group">
            <label>Адрес подключения:</label>
            <input type="text" class="input-user" value="{{ user.address }}">
        </div>

        <div class="form-group">
            <label>Новый пароль:</label>
            <input type="password" class="input-user" placeholder="Введите новый пароль">
        </div>

        <button class="save-btn">Сохранить изменения</button>

    </div>
    
</div>
        </div>
     </div>
     <script src="{%static 'js/settingsbyuser.js'%}"></script>
     <script src="{%static 'js/make_messeges_from_site.js'%}"></script>
    {%endblock%}    
</body>
</html>
